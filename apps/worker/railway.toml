[build]
builder = "nixpacks"
buildCommand = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @website-checker/database prisma:generate && pnpm --filter @website-checker/worker build"

[deploy]
startCommand = "cd ../.. && pnpm --filter @website-checker/worker start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
NODE_ENV = "production"